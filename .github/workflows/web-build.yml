name: Web build

on:
  push:
    branches: [main, "codex/mystery-atlas-v3-web"]
    paths:
      - "web/**"
      - "app/src/main/assets/data/**"
      - ".github/workflows/web-build.yml"
  pull_request:
    paths:
      - "web/**"
      - "app/src/main/assets/data/**"
      - ".github/workflows/web-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:static
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MysteryAtlas-Web-RC-evidence
          path: |
            web/out
            web/artifacts/screenshots
            web/playwright-report
            web/test-results
          retention-days: 14


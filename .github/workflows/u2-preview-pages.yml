name: Mystery Atlas U2 free preview
on:
  push:
    branches: [work/mystery-atlas-unified-web-mobile-u2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mystery-atlas-u2-preview
  cancel-in-progress: false

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Content validator
        run: python3 shared/tools/sync_content.py

      - name: Macro-sync pipeline tests
        run: python3 -m unittest -v test_macro_sync.py
        working-directory: shared/tools

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Unit tests
        run: npm run test
        working-directory: web

      - name: Build
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_MYSTERY_ATLAS_BASE_PATH: /MysteryAtlas
          NEXT_PUBLIC_SITE_URL: https://rhtngudwls2-lang.github.io

      - name: Static links
        run: npm run check:static
        working-directory: web

      - name: Metadata audit
        run: python3 shared/tools/audit_static_metadata.py

      - name: Verify Web269 totals
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          idx=json.loads(Path("shared/content/index.json").read_text())
          man=json.loads(Path("shared/content/visual-manifest.json").read_text())
          assert len(idx["items"]) == 269
          assert len(man["assets"]) == 1560
          assert len(man["assets"])//2 == 780
          print("VALIDATION_TOTALS productized=269 visualGroups=780 localizedImages=1560 legacy=9 catalog=278")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Chromium for deployed QA
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Deployed Preview browser QA
        working-directory: web
        env:
          PREVIEW_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from "@playwright/test";

          const base=(process.env.PREVIEW_URL || "https://rhtngudwls2-lang.github.io/MysteryAtlas/").replace(/\/$/,"");
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage();

          async function go(path){
            const response=await page.goto(base+path,{waitUntil:"networkidle"});
            if(!response || !response.ok()) throw new Error(`route failed ${path}: ${response?.status()}`);
          }

          for(const width of [360,390,430]){
            await page.setViewportSize({width,height:900});
            for(const path of ["/en/","/en/explore/","/en/search/"]){
              await go(path);
              const m=await page.evaluate(()=>({viewport:innerWidth,scroll:document.documentElement.scrollWidth}));
              if(m.scroll>m.viewport+1) throw new Error(`overflow ${path} @ ${width}: ${m.scroll} > ${m.viewport}`);
            }
          }

          await page.setViewportSize({width:390,height:900});
          await go("/en/explore/");
          const catalogText=(await page.locator(".result-count").first().textContent()) || "";
          const catalog=parseInt(catalogText,10);
          if(catalog!==278) throw new Error(`deployed catalog count ${catalogText}`);
          const legacy=["cooper","voynich","mary-celeste","dyatlov","wow","rohonc","phaistos","rendlesham","loch-ness"];
          for(const slug of legacy){
            if(await page.locator(`[data-case="${slug}"]`).count()!==1) throw new Error(`missing legacy ${slug}`);
          }
          const deployedProductized=catalog-legacy.length;
          if(deployedProductized!==269) throw new Error(`deployed productized ${deployedProductized}`);

          await go("/en/search/");
          await page.getByTestId("search-input").fill("Dreyfus");
          await page.waitForTimeout(150);
          if(await page.locator('[data-case="dreyfus-1894-affair"]').count()!==1) throw new Error("search failed for Batch45 representative");

          const reps=["geumgwanchong-isaji-king","dreyfus-1894-affair","dancing-plague-1518","fatima-1917-sun"];
          for(const width of [360,390,430]){
            await page.setViewportSize({width,height:900});
            for(const slug of reps){
              await go(`/ko/cases/${slug}/`);
              if(await page.locator(".u2-hero-visual img").count()===0) throw new Error(`hero missing ${slug}`);
              if(await page.locator(".u2-visual img").count()===0) throw new Error(`visual missing ${slug}`);
              if(await page.locator("#sources li").count()===0) throw new Error(`sources missing ${slug}`);
              const box=await page.locator("h1").first().boundingBox();
              if(!box || box.x+box.width>width+1) throw new Error(`title overflow ${slug} @ ${width}`);
            }
          }

          await page.setViewportSize({width:390,height:900});
          await go("/en/cases/fatima-1917-sun/");
          await page.locator(".reader-settings > summary").click();
          await page.getByRole("group",{name:"Text size"}).getByRole("button",{name:"18"}).click();
          if(await page.locator("html").getAttribute("data-reader-size")!=="18") throw new Error("Aa failed");

          const koLink=page.locator('.article-languages a[href*="/ko/cases/fatima-1917-sun/"]').first();
          if(await koLink.count()!==1) throw new Error("KO switch link missing");
          await koLink.click();
          await page.waitForLoadState("networkidle");
          if(!page.url().includes("/ko/cases/fatima-1917-sun/")) throw new Error("KO/EN switch failed");

          await go("/en/cases/fatima-1917-sun/");
          await page.evaluate(()=>{
            window.__mysteryCopied="";
            Object.defineProperty(navigator,"share",{value:undefined,configurable:true});
            Object.defineProperty(navigator,"clipboard",{value:{writeText:async(v)=>{window.__mysteryCopied=v;}},configurable:true});
          });
          await page.getByRole("button",{name:"Share"}).click();
          const copied=await page.evaluate(()=>window.__mysteryCopied);
          if(copied!==page.url().split("#")[0]) throw new Error(`Share URL mismatch ${copied} != ${page.url()}`);

          await page.evaluate(()=>localStorage.setItem("mystery-atlas-reading-v1",JSON.stringify({
            canonicalId:"fatima-1917-sun",locale:"en",blockId:"block-intro",updatedAt:Date.now()
          })));
          await go("/en/");
          await page.waitForTimeout(200);
          if(await page.locator('section[aria-label="Continue reading"].is-ready').count()!==1) throw new Error("Continue Reading failed");

          await browser.close();
          console.log("BROWSER_QA_PASS DEPLOYED_PRODUCTIZED=269 DEPLOYED_CATALOG=278 VIEWPORTS=360,390,430");
          NODE
